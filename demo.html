<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Chibi Model Viewer</title>
    <style>
        /* Tam ekran kurulumu ve koyu arka plan */
        body { 
            margin: 0; 
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%); 
            overflow: hidden; 
            font-family: sans-serif;
        }
        canvas { display: block; }
        
        /* Yükleme ekranı tasarımı */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #555;
        }

        /* Alt kısma küçük bir bilgi notu */
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div style="font-size: 20px; margin-bottom: 10px;">Model Yükleniyor...</div>
        <div id="percent">0%</div>
    </div>

    <div id="instructions">Döndürmek için sürükle • Yakınlaşmak için kaydır</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. SAHNE VE KAMERA AYARLARI
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 2, 5);

        // 2. RENDERER (GÖRSELLEŞTİRİCİ)
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // Daha gerçekçi renkler
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // 3. IŞIKLANDIRMA
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); // Genel yumuşak ışık
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 2); // Ana vuran ışık
        mainLight.position.set(5, 10, 7.5);
        scene.add(mainLight);

        const fillLight = new THREE.PointLight(0xffffff, 1); // Arkadan gelen hafif ışık
        fillLight.position.set(-5, 0, -5);
        scene.add(fillLight);

        // 4. KONTROLLER
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Hareket durduğunda pürüzsüzce yavaşlar
        controls.dampingFactor = 0.05;
        controls.minDistance = 1; // En fazla ne kadar yaklaşabilir
        controls.maxDistance = 20; // En fazla ne kadar uzaklaşabilir

        // 5. MODEL YÜKLEME
        const loader = new GLTFLoader();
        const modelPath = 'cute chibi girl 3d model_Clone1.glb';

        loader.load(
            modelPath,
            function (gltf) {
                const model = gltf.scene;
                scene.add(model);

                // Modeli sahnede ortalamak için kutu hesaplaması
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                // Modeli (0,0,0) noktasına çek
                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - center.y);
                model.position.z += (model.position.z - center.z);

                // Kamerayı modelin boyutuna göre otomatik ayarla
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.z = maxDim * 2.5;
                controls.target.set(0, 0, 0);
                controls.update();

                // Yükleme ekranını kaldır
                document.getElementById('loader').style.display = 'none';
                console.log("Model başarıyla yüklendi!");
            },
            function (xhr) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById('percent').innerText = percent + '%';
            },
            function (error) {
                console.error('Model yüklenirken bir hata oluştu:', error);
                document.getElementById('loader').innerHTML = "Hata: Model bulunamadı!<br><small>Dosya adının doğru olduğundan emin olun.</small>";
            }
        );

        // 6. ANİMASYON DÖNGÜSÜ
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }

        // 7. EKRAN BOYUTU DEĞİŞTİĞİNDE GÜNCELLE
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        animate();
    </script>
</body>
</html>
